name: swing-bot

on:
  schedule:
    # 19:20 UTC = 15:20 ET (EDT). GitHub cron is best-effort and can be delayed
    # 5-30+ min, so we schedule EARLY and the runner refuses to trade outside
    # 15:15-15:58 ET. A missed run beats a run at the wrong price.
    - cron: "20 19 * * 1-5"
    # 20:20 UTC = 15:20 ET (EST, Nov-Mar). The window check makes the
    # off-season schedule a harmless no-op.
    - cron: "20 20 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore the time window (testing only)"
        type: boolean
        default: false

concurrency:
  group: swing-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Models are ~74MB and take minutes to train, so cache rather than
      # rebuilding every run.
      - name: Restore models
        uses: actions/cache@v4
        with:
          path: state/swing_models
          key: swing-models-${{ hashFiles('app/swing.py','app/swing_engine.py') }}
          restore-keys: |
            swing-models-

      # Fail early and clearly if secrets are missing or mis-scoped, rather than
      # deep inside the runner. Prints lengths only -- never the values.
      - name: Check secrets
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: |
          ok=1
          if [ -z "$ALPACA_KEY_ID" ]; then
            echo "::error::ALPACA_KEY_ID is empty or not visible to this job"
            ok=0
          else
            echo "ALPACA_KEY_ID present (${#ALPACA_KEY_ID} chars, expect 26)"
          fi
          if [ -z "$ALPACA_SECRET" ]; then
            echo "::error::ALPACA_SECRET is empty or not visible to this job"
            ok=0
          else
            echo "ALPACA_SECRET present (${#ALPACA_SECRET} chars, expect 43-44)"
          fi
          if [ "$ok" = "0" ]; then
            echo "Add them under Settings > Secrets and variables > Actions >"
            echo "  *Repository secrets* (NOT Environment secrets), named exactly"
            echo "  ALPACA_KEY_ID and ALPACA_SECRET."
            exit 1
          fi

      - name: Run decision cycle
        id: cycle
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          ALPACA_PAPER: "true"
          STATE_DIR: state
          MODEL_DIR: models
          LOG_DIR: logs
          FORCE_RUN: ${{ inputs.force }}
          PYTHONPATH: ${{ github.workspace }}
        run: python -m app.gh_runner 2>&1 | tee run.log

      # Readable summary on the run page, so checking the bot is a glance rather
      # than scrolling raw logs.
      - name: Summary
        if: always()
        run: |
          {
            echo "## Swing bot — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            if grep -q "outside the" run.log 2>/dev/null; then
              echo "**SKIPPED** — outside the 15:15–15:58 ET trading window."
            elif grep -q "RESULT" run.log 2>/dev/null; then
              echo "### Result"
              echo '```'
              grep -E "RESULT|equity=" run.log | tail -3
              echo '```'
              ENTRIES=$(grep -c "ENTRY " run.log 2>/dev/null || echo 0)
              CLOSES=$(grep -c "closing " run.log 2>/dev/null || echo 0)
              FAILS=$(grep -c "order failed" run.log 2>/dev/null || echo 0)
              echo ""
              echo "| | |"
              echo "|---|---|"
              echo "| Opened | $ENTRIES |"
              echo "| Closed | $CLOSES |"
              echo "| Rejected | $FAILS |"
              if [ "$FAILS" != "0" ]; then
                echo ""
                echo "**$FAILS orders were rejected — check sizing/buying power.**"
              fi
              echo ""
              echo "### Exposure"
              echo '```'
              grep "exposure:" run.log | tail -1 || echo "n/a"
              echo '```'
              if grep -q "ENTRY " run.log; then
                echo "### Positions opened"
                echo '```'
                grep "ENTRY " run.log | sed 's/.*swing_engine //' | head -20
                echo '```'
              fi
            else
              echo "**No cycle result** — the run may have failed before trading."
            fi
          } >> $GITHUB_STEP_SUMMARY

      - name: Persist state
        if: always()
        run: |
          git config user.name "swing-bot"
          git config user.email "swing-bot@users.noreply.github.com"
          git add state/swing_state.json state/monitor.jsonl 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "state: $(date -u +%Y-%m-%d) cycle"
            git push
          else
            echo "no state change"
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_number }}
          path: |
            logs/
            state/monitor.jsonl
          retention-days: 30
          if-no-files-found: ignore
